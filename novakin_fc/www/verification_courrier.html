{% extends "templates/web.html" %}

{% block page_content %}

<div style="
    max-width:720px;
    margin:50px auto;
    padding:25px;
    font-family:'Helvetica Neue',Arial,sans-serif;
">

    <div style="text-align:center; margin-bottom:30px;">

        <img
            src="/files/novakin-crest.png"
            style="height:80px; margin-bottom:15px;"
        >

        <h2 style="
            margin:0;
            font-weight:800;
            color:#171717;
        ">
            NOVAKIN <span style="color:#C9A227;">FC</span>
        </h2>

        <div style="
            margin-top:6px;
            font-size:11px;
            color:#777;
            letter-spacing:1px;
            text-transform:uppercase;
        ">
            Vérification de courrier
        </div>

    </div>

    <div style="
        border:1px solid #E5E5E5;
        border-radius:14px;
        overflow:hidden;
        background:#FFFFFF;
        box-shadow:0 8px 30px rgba(0,0,0,0.06);
    ">

        <div style="
            padding:30px;
            text-align:center;
            background:#FAFAFA;
            border-bottom:1px solid #E5E5E5;
        ">

            <div style="
                width:48px;
                height:48px;
                line-height:48px;
                margin:auto;
                background:#C9A227;
                border-radius:50%;
                font-size:23px;
                font-weight:bold;
            ">
                ✓
            </div>

            <div style="
                margin-top:15px;
                font-size:20px;
                font-weight:800;
                color:#171717;
            ">
                RÉCEPTION CONFIRMÉE
            </div>

            <div style="
                margin-top:6px;
                color:#666;
                font-size:13px;
            ">
                Courrier enregistré électroniquement par NOVAKIN FC.
            </div>

        </div>

        <div style="padding:30px;">

            <div style="
                font-size:10px;
                color:#999;
                text-transform:uppercase;
                letter-spacing:1px;
            ">
                Référence
            </div>

            <div style="
                margin-top:4px;
                font-size:16px;
                font-weight:700;
            ">
                TEST-NOVAKIN-001
            </div>

        </div>

    </div>

    <div style="
        margin-top:20px;
        text-align:center;
        color:#AAA;
        font-size:10px;
    ">
        Novakin FC · Là où la gloire commence
    </div>

</div>

{% endblock %}
